<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крутой интернет-магазин</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Крутой интернет-магазин</h1>
        <div class="cart">Корзина: <span id="cart-count">0</span></div>
    </header>
    <div class="store">
        <div class="product">
            <img src="http://3736630"alt="Смартфон">
            <h3>Смартфон</h3>
            <p>Цена: 1200 руб.</p>
            <button class="add-to-cart">Добавить в корзину
        </div>
          <div class="product">
            <h3>Наушники</h3>
            <p>Цена: 500 руб.</p>
            <button class="add-to-cart">Добавить в корзину
        </div>
        <div class="product">
            <h3>чехол</h3>
            <p>Цена: 200 руб.</p>
            <button class="add-to-cart">Добавить в корзину
        </div>
        <div class="product">
            <h3>ноутбук</h3>
            <p>Цена: 5100 руб.</p>
            <button class="add-to-cart">Добавить в корзину
        </div>
     </div>
    <script src="script.js"></script>
</body>
</html>
